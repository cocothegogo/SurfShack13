<!DOCTYPE html>
<html lang="en">

<head>
	<meta http-equiv='X-UA-Compatible' content='IE=edge'>
	<meta charset='utf-8'>
	<link rel='stylesheet' href='ui.css'>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			overflow: hidden;
			background-color: #000;
		}

		#toolbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			height: 28px;
			padding: 0 8px;
			background-color: #1a1f12;
			border-bottom: 2px solid #3f5a1c;
			color: #9bff4a;
			font-family: "Courier New", monospace;
			font-size: 13px;
		}

		#game {
			display: block;
			width: 100%;
			height: calc(100% - 30px);
			border: none;
			background-color: #000;
		}
	</style>
</head>

<body>
	<div id="toolbar">
		<span>FALLOUT: SONORA &mdash; insert cap to continue</span>
		<span>
			<input id="reload" class="btn" type="button" value="Reload" />
			<input id="external" class="btn" type="button" value="Open in browser" />
		</span>
	</div>
	<iframe id="game"
		src="https://fallout-nevada.ru/#/Fallout_Sonora_1_14_dlc_eng"
		allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
		allowfullscreen></iframe>
	<script>
		/* ref insert */

		function sendToByond(...pairs) {
			const params = new URLSearchParams();
			params.append('src', ref);

			for (let i = 0; i < pairs.length; i += 2) {
				if (pairs[i + 1] !== undefined) {
					params.append(pairs[i], pairs[i + 1]);
				}
			}
			window.location.search = params.toString();
		}

		const game = document.getElementById("game");
		document.getElementById("reload").addEventListener("click", function () {
			game.src = game.src;
		});
		document.getElementById("external").addEventListener("click", function () {
			sendToByond("open_external", 1);
		});
	</script>
</body>

</html>
